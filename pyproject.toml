[project]
name = "sts-ai-tooling"
version = "0.1.0"
description = "Reproducible Python environments for maintained sts_lightspeed tooling"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "xgboost>=2.0",
]
ml = [
    "torch>=2.0",
    "xgboost>=2.0",
]
research = [
    "catboost>=1.2",
    "optuna>=3.0",
]
live-driver = [
    "mcp>=2.2.0",
    "typesafe-sdk>=0.7.0",
]

[tool.uv]
package = false
